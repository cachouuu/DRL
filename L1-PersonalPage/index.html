<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam WEI | Personal Space</title>
    <meta name="description" content="Personal single-page website for Sam WEI featuring a dynamic clock and premium design.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <main class="container">
        <section class="glass-card" id="main-card">
            <header>
                <h1 id="user-name">SAM <span class="highlight">WEI</span></h1>
            </header>
            
            <div class="clock-wrapper">
                <div id="clock" class="clock-display">00:00:00</div>
                <div id="date" class="date-display">Wednesday, February 25, 2026</div>
            </div>
            
            <footer class="footer-note">
                <p>Welcome to my digital sanctuary.</p>
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
