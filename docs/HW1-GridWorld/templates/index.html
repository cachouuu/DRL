<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridWorld Q-Learning</title>
    <style>
        /* ======================================================
       Global reset & typography
    ====================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }

        /* ======================================================
       Card container
    ====================================================== */
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* ======================================================
       Heading
    ====================================================== */
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 36px;
        }

        /* ======================================================
       Form elements
    ====================================================== */
        label {
            display: block;
            text-align: left;
            font-size: 0.9rem;
            color: #c4b5fd;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            border: 1.5px solid rgba(167, 139, 250, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #f3f4f6;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            margin-bottom: 28px;
        }

        input[type="number"]:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
        }

        /* ======================================================
       Submit button
    ====================================================== */
        button[type="submit"] {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            color: #fff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(124, 58, 237, 0.55);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* ======================================================
       Hint text
    ====================================================== */
        .hint {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🧭 GridWorld Q-Learning</h1>
        <p class="subtitle">Reinforcement Learning Homework Demo</p>

        <!--
      POST to /grid – Flask will generate an n×n grid page.
      n must be between 5 and 9 inclusive.
    -->
        <form action="/grid" method="post">
            <label for="n">Grid Size (n × n)</label>
            <input type="number" id="n" name="n" min="5" max="9" value="5" required />

            <button type="submit">Generate Grid →</button>
        </form>

        <p class="hint">Enter a value between 5 and 9</p>
    </div>
</body>

</html>
